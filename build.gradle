plugins {
	id 'org.springframework.boot' version '4.2.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'java'
	id "org.sonarqube" version "7.6.0.18749"
}

group = 'com.mtgcollectionorganizer'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springCloudVersion', '2026.0.0')
}

dependencies {
	// spring web
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'

	// spring security
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.bouncycastle:bcprov-jdk18on:1.86'
	implementation 'com.auth0:java-jwt:4.6.2'

	// database
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'org.postgresql:postgresql:42.7.14'

	// lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// openapi / swagger ui
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.1'

	// open feign
	implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'

	// spring test
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'

	// h2 test
	testImplementation 'com.h2database:h2:2.5.252'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

sonar {
	properties {
		property "sonar.projectKey", "guibaarros_mtg-collection-organizer"
		property "sonar.organization", "guibaarros"
		property "sonar.host.url", "https://sonarcloud.io"
		property "sonar.exclusions", "src/main/java/com/mtgcollectionorganizer/api/MtgCollectionOrganizerApiModuleApplication.java"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

jar {
	enabled = false
}
